<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="app-page-title">이사가자 시안아!</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root {
      --bg-color: #0F172A;
      --text-color: #F8FAFC;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s, color 0.3s;
    }
    .active-tab {
      color: #F59E0B;
      font-weight: 700;
    }
    .card-glass {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="pb-24">

  <!-- 상단 앱 헤더 -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3.5 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🏠</span>
      <h1 class="text-xl font-bold tracking-tight text-amber-400" id="header-title-text">이사가자 시안아!</h1>
    </div>
    <div class="text-xs text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-full border border-slate-700/50">
      스마트 웹 가계부
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

    <!-- 1. 대시보드 탭 -->
    <section id="tab-dashboard" class="space-y-4">
      <!-- 핵심 KPI 지처 카운터 -->
      <div class="grid grid-cols-2 gap-3">
        <div class="card-glass p-4 rounded-2xl">
          <div class="text-xs opacity-70 mb-1">🏦 총 자산 (보유)</div>
          <div class="text-lg font-extrabold text-teal-400" id="dash-total-asset">0원</div>
        </div>
        <div class="card-glass p-4 rounded-2xl">
          <div class="text-xs opacity-70 mb-1">💰 당월 총 수입</div>
          <div class="text-lg font-extrabold text-emerald-400" id="dash-total-income">0원</div>
        </div>
        <div class="card-glass p-4 rounded-2xl">
          <div class="text-xs opacity-70 mb-1">💸 당월 총 지출</div>
          <div class="text-lg font-extrabold text-rose-400" id="dash-total-expense">0원</div>
        </div>
        <div class="card-glass p-4 rounded-2xl">
          <div class="text-xs opacity-70 mb-1">✨ 당월 순수익 (잔여)</div>
          <div class="text-lg font-extrabold text-amber-400" id="dash-net-income">0원</div>
        </div>
      </div>

      <!-- 자산 비중 차트 -->
      <div class="card-glass p-4 rounded-2xl space-y-3">
        <h3 class="text-sm font-bold flex items-center gap-1.5">
          <span>📊</span> 자산 포트폴리오 비중
        </h3>
        <div class="relative h-48 flex justify-center items-center">
          <canvas id="assetDoughnutChart"></canvas>
        </div>
      </div>

      <!-- 카테고리별 지출 차트 -->
      <div class="card-glass p-4 rounded-2xl space-y-3">
        <h3 class="text-sm font-bold flex items-center gap-1.5">
          <span>🏷️</span> 당월 카테고리별 지출 분석
        </h3>
        <div class="relative h-56">
          <canvas id="expenseBarChart"></canvas>
        </div>
      </div>

      <!-- 최근 지출 내역 -->
      <div class="card-glass p-4 rounded-2xl space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold">최근 거래 내역</h3>
          <span class="text-xs opacity-60">최근 5건</span>
        </div>
        <div id="recent-expense-list" class="space-y-2 text-sm"></div>
      </div>
    </section>

    <!-- 2. 지출입력 탭 -->
    <section id="tab-input" class="hidden card-glass p-5 rounded-2xl space-y-4">
      <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
        <span>📝</span> 지출 및 수입 기록
      </h2>

      <!-- 문자 빠른 파싱 -->
      <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 space-y-2">
        <div class="text-xs text-amber-300 font-semibold">⚡ 결제 문자/알림톡 복사 붙여넣기</div>
        <textarea id="sms-text" rows="2" placeholder="카드 승인 문자를 붙여넣으세요" class="w-full text-xs p-2 bg-slate-900/90 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-amber-400"></textarea>
        <button onclick="parseSMS()" class="w-full py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg text-xs transition">금액 파싱 및 입력</button>
      </div>

      <form id="expense-form" class="space-y-3" onsubmit="addTransaction(event)">
        <div>
          <label class="text-xs opacity-70">날짜</label>
          <input type="date" id="in-date" required class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-400">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs opacity-70">구분</label>
            <select id="in-type" class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-400">
              <option value="지출">지출</option>
              <option value="수입">수입</option>
            </select>
          </div>
          <div>
            <label class="text-xs opacity-70">사용자</label>
            <select id="in-user" class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-400"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs opacity-70">카테고리</label>
            <select id="in-category" class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-400"></select>
          </div>
          <div>
            <label class="text-xs opacity-70">결제수단</label>
            <select id="in-paymethod" class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-400"></select>
          </div>
        </div>
        <div>
          <label class="text-xs opacity-70">내용 / 항목명</label>
          <input type="text" id="in-item" placeholder="예: 이마트 장보기" required class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="text-xs opacity-70">금액 (원)</label>
          <input type="number" id="in-amount" placeholder="0" required class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-amber-400 focus:outline-none focus:border-amber-400">
        </div>
        <button type="submit" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold rounded-xl text-sm shadow-lg transition">저장하기</button>
      </form>
    </section>

    <!-- 3. 자산현황 탭 -->
    <section id="tab-asset" class="hidden space-y-4">
      <div class="card-glass p-5 rounded-2xl space-y-4">
        <h2 class="text-lg font-bold text-teal-400 flex items-center gap-2">
          <span>🏦</span> 자산 보유 현황
        </h2>
        <form onsubmit="addAsset(event)" class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-800">
          <div class="grid grid-cols-2 gap-2">
            <select id="asset-type" class="p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100">
              <option value="예금">예금 (현금성)</option>
              <option value="적금">적금 (목돈)</option>
              <option value="주식">주식 (투자)</option>
              <option value="부동산">부동산/기타</option>
            </select>
            <input type="text" id="asset-name" placeholder="자산명 (예: 청약)" required class="p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="number" id="asset-amount" placeholder="평가액/잔액" required class="p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100">
            <button type="submit" class="bg-teal-500 text-slate-950 font-bold rounded-lg text-xs">자산 추가</button>
          </div>
        </form>
        <div id="asset-list" class="space-y-2 text-sm"></div>
      </div>
    </section>

    <!-- 4. 예산관리 탭 (소진율 위험 기준 설정 포함) -->
    <section id="tab-budget" class="hidden card-glass p-5 rounded-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
          <span>🎯</span> 예산 소진율 관리
        </h2>
        <div class="flex items-center space-x-1">
          <span class="text-xs opacity-70">위험 기준:</span>
          <input type="number" id="budget-warn-threshold" value="80" min="1" max="100" onchange="updateWarnThreshold(this.value)" class="w-12 p-1 text-center text-xs bg-slate-900 border border-slate-700 rounded text-amber-400 font-bold">
          <span class="text-xs opacity-70">%</span>
        </div>
      </div>
      <div id="budget-progress-list" class="space-y-4"></div>
    </section>

    <!-- 5. 설정 탭 (타이틀, 커스텀 테마 색상 설정 포함) -->
    <section id="tab-settings" class="hidden card-glass p-5 rounded-2xl space-y-5">
      <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
        <span>⚙️</span> 가계부 설정 & 테마
      </h2>

      <!-- 타이틀 수정 -->
      <div class="space-y-2">
        <label class="text-xs font-bold opacity-80">가계부 이름(타이틀) 변경</label>
        <div class="flex gap-2">
          <input type="text" id="setting-title-input" placeholder="이사가자 시안아!" class="flex-1 p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100">
          <button onclick="updateAppTitle()" class="bg-amber-500 text-slate-950 px-3 py-2 font-bold rounded-lg text-xs">변경</button>
        </div>
      </div>

      <!-- 테마/배경/글씨 색상 커스텀 -->
      <div class="space-y-3 border-t border-slate-800 pt-4">
        <h3 class="text-xs font-bold opacity-80">앱 커스텀 색상 설정</h3>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] opacity-70 block mb-1">배경 색상</label>
            <input type="color" id="bg-color-picker" value="#0F172A" onchange="changeThemeColor('bgColor', this.value)" class="w-full h-8 bg-transparent cursor-pointer rounded border border-slate-700">
          </div>
          <div>
            <label class="text-[11px] opacity-70 block mb-1">글자 색상</label>
            <input type="color" id="text-color-picker" value="#F8FAFC" onchange="changeThemeColor('textColor', this.value)" class="w-full h-8 bg-transparent cursor-pointer rounded border border-slate-700">
          </div>
        </div>
        <button onclick="resetThemeColors()" class="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded border border-slate-700 text-slate-300">기본 테마로 복원</button>
      </div>

      <!-- 카테고리 관리 -->
      <div class="space-y-3 border-t border-slate-800 pt-4">
        <h3 class="text-xs font-bold opacity-80">카테고리 항목 관리</h3>
        <div class="flex gap-2">
          <input type="text" id="new-cat-input" placeholder="새 카테고리명" class="flex-1 p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100">
          <button onclick="addConfigItem('categories', 'new-cat-input')" class="bg-amber-500 text-slate-950 px-3 py-2 font-bold rounded-lg text-xs">추가</button>
        </div>
        <div id="setting-cat-tags" class="flex flex-wrap gap-1.5"></div>
      </div>

      <!-- 백업 및 초기화 -->
      <div class="space-y-3 border-t border-slate-800 pt-4">
        <h3 class="text-xs font-bold opacity-80">데이터 백업 및 초기화</h3>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="exportData()" class="py-2 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg border border-slate-700">JSON 백업 다운로드</button>
          <button onclick="resetData()" class="py-2 bg-rose-950 text-rose-400 text-xs rounded-lg border border-rose-800">전체 초기화</button>
        </div>
      </div>
    </section>

  </main>

  <!-- 하단 탭 바 -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 max-w-md mx-auto">
    <div class="flex justify-around items-center h-16 text-xs opacity-80">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center space-y-1 active-tab">
        <span class="text-lg">📊</span>
        <span>대시보드</span>
      </button>
      <button onclick="switchTab('input')" id="nav-input" class="flex flex-col items-center space-y-1">
        <span class="text-lg">📝</span>
        <span>지출입력</span>
      </button>
      <button onclick="switchTab('asset')" id="nav-asset" class="flex flex-col items-center space-y-1">
        <span class="text-lg">🏦</span>
        <span>자산현황</span>
      </button>
      <button onclick="switchTab('budget')" id="nav-budget" class="flex flex-col items-center space-y-1">
        <span class="text-lg">🎯</span>
        <span>예산관리</span>
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center space-y-1">
        <span class="text-lg">⚙️</span>
        <span>설정</span>
      </button>
    </div>
  </nav>

  <!-- JavaScript 애플리케이션 로직 -->
  <script>
    let appData = {
      title: "이사가자 시안아!",
      theme: { bgColor: "#0F172A", textColor: "#F8FAFC" },
      budgetWarnThreshold: 80,
      transactions: [],
      assets: [
        { type: '예금', name: '주거래 통장', amount: 5000000 },
        { type: '적금', name: '청약저축', amount: 6000000 },
        { type: '주식', name: '삼성전자', amount: 8000000 }
      ],
      config: {
        categories: ["식비", "육아/교육", "주거/공과금", "교통/차량", "생활/생필품", "통신비", "보험/의료", "쇼핑/패션", "여가/문화", "경조사", "기타"],
        users: ["남편", "아내", "공동"],
        payMethods: ["신용카드", "체크카드", "현금", "계좌이체", "자동이체"],
        budgets: { "식비": 600000, "육아/교육": 600000, "주거/공과금": 500000, "교통/차량": 300000 }
      }
    };

    let doughnutChart = null;
    let barChart = null;

    window.onload = function() {
      loadLocalStorage();
      applyThemeAndTitle();
      document.getElementById('in-date').value = new Date().toISOString().substring(0, 10);
      renderDropdowns();
      renderDashboard();
      initCharts();
    };

    function saveLocalStorage() {
      localStorage.setItem('isagaja_budget_data', JSON.stringify(appData));
      renderDashboard();
      updateCharts();
    }

    function loadLocalStorage() {
      const saved = localStorage.getItem('isagaja_budget_data');
      if (saved) appData = JSON.parse(saved);
    }

    function applyThemeAndTitle() {
      document.getElementById('header-title-text').innerText = appData.title || "이사가자 시안아!";
      document.getElementById('app-page-title').innerText = appData.title || "이사가자 시안아!";
      document.getElementById('setting-title-input').value = appData.title || "이사가자 시안아!";

      const theme = appData.theme || { bgColor: "#0F172A", textColor: "#F8FAFC" };
      document.documentElement.style.setProperty('--bg-color', theme.bgColor);
      document.documentElement.style.setProperty('--text-color', theme.textColor);
      document.getElementById('bg-color-picker').value = theme.bgColor;
      document.getElementById('text-color-picker').value = theme.textColor;

      document.getElementById('budget-warn-threshold').value = appData.budgetWarnThreshold || 80;
    }

    function updateAppTitle() {
      const newTitle = document.getElementById('setting-title-input').value.trim();
      if (newTitle) {
        appData.title = newTitle;
        saveLocalStorage();
        applyThemeAndTitle();
        alert("가계부 타이틀이 변경되었습니다!");
      }
    }

    function changeThemeColor(key, value) {
      if (!appData.theme) appData.theme = { bgColor: "#0F172A", textColor: "#F8FAFC" };
      appData.theme[key] = value;
      saveLocalStorage();
      applyThemeAndTitle();
    }

    function resetThemeColors() {
      appData.theme = { bgColor: "#0F172A", textColor: "#F8FAFC" };
      saveLocalStorage();
      applyThemeAndTitle();
    }

    function updateWarnThreshold(val) {
      appData.budgetWarnThreshold = parseInt(val) || 80;
      saveLocalStorage();
      if (!document.getElementById('tab-budget').classList.contains('hidden')) {
        renderBudgetProgress();
      }
    }

    function switchTab(tabName) {
      ['dashboard', 'input', 'asset', 'budget', 'settings'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`nav-${t}`).classList.remove('active-tab');
      });
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`nav-${tabName}`).classList.add('active-tab');

      if (tabName === 'asset') renderAssetList();
      if (tabName === 'budget') renderBudgetProgress();
      if (tabName === 'settings') renderSettings();
    }

    function renderDropdowns() {
      document.getElementById('in-user').innerHTML = appData.config.users.map(u => `<option value="${u}">${u}</option>`).join('');
      document.getElementById('in-category').innerHTML = appData.config.categories.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById('in-paymethod').innerHTML = appData.config.payMethods.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    function addTransaction(e) {
      e.preventDefault();
      const tx = {
        id: Date.now(),
        date: document.getElementById('in-date').value,
        type: document.getElementById('in-type').value,
        user: document.getElementById('in-user').value,
        category: document.getElementById('in-category').value,
        payMethod: document.getElementById('in-paymethod').value,
        item: document.getElementById('in-item').value,
        amount: parseInt(document.getElementById('in-amount').value) || 0
      };
      appData.transactions.unshift(tx);
      saveLocalStorage();
      document.getElementById('expense-form').reset();
      document.getElementById('in-date').value = new Date().toISOString().substring(0, 10);
      switchTab('dashboard');
    }

    function parseSMS() {
      const text = document.getElementById('sms-text').value;
      if (!text) return;

      const amtMatch = text.match(/([0-9,]+)원/);
      if (amtMatch) {
        document.getElementById('in-amount').value = parseInt(amtMatch[1].replace(/,/g, ''));
      }
      document.getElementById('in-item').value = "카드 승인 내역";
      alert("금액이 파싱되었습니다!");
    }

    function renderDashboard() {
      const totalAsset = appData.assets.reduce((sum, a) => sum + a.amount, 0);
      const totalIncome = appData.transactions.filter(t => t.type === '수입').reduce((sum, t) => sum + t.amount, 0);
      const totalExpense = appData.transactions.filter(t => t.type === '지출').reduce((sum, t) => sum + t.amount, 0);

      document.getElementById('dash-total-asset').innerText = totalAsset.toLocaleString() + '원';
      document.getElementById('dash-total-income').innerText = totalIncome.toLocaleString() + '원';
      document.getElementById('dash-total-expense').innerText = totalExpense.toLocaleString() + '원';
      document.getElementById('dash-net-income').innerText = (totalIncome - totalExpense).toLocaleString() + '원';

      const listEl = document.getElementById('recent-expense-list');
      if (appData.transactions.length === 0) {
        listEl.innerHTML = '<div class="text-xs opacity-50 text-center py-2">등록된 내역이 없습니다.</div>';
      } else {
        listEl.innerHTML = appData.transactions.slice(0, 5).map(t => `
          <div class="flex justify-between items-center bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
            <div>
              <div class="font-bold text-slate-200">${t.item} <span class="text-xs font-normal opacity-60">(${t.category})</span></div>
              <div class="text-xs opacity-50">${t.date} · ${t.user}</div>
            </div>
            <div class="font-extrabold ${t.type === '수입' ? 'text-emerald-400' : 'text-rose-400'}">
              ${t.type === '수입' ? '+' : '-'}${t.amount.toLocaleString()}원
            </div>
          </div>
        `).join('');
      }
    }

    function initCharts() {
      const ctxDoughnut = document.getElementById('assetDoughnutChart').getContext('2d');
      doughnutChart = new Chart(ctxDoughnut, {
        type: 'doughnut',
        data: getAssetChartData(),
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#94A3B8', font: { size: 10 } } } }
        }
      });

      const ctxBar = document.getElementById('expenseBarChart').getContext('2d');
      barChart = new Chart(ctxBar, {
        type: 'bar',
        data: getExpenseChartData(),
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94A3B8', font: { size: 9 } }, grid: { display: false } },
            y: { ticks: { color: '#94A3B8', font: { size: 9 } }, grid: { color: '#334155' } }
          }
        }
      });
    }

    function updateCharts() {
      if (doughnutChart && barChart) {
        doughnutChart.data = getAssetChartData();
        doughnutChart.update();
        barChart.data = getExpenseChartData();
        barChart.update();
      }
    }

    function getAssetChartData() {
      const types = ['예금', '적금', '주식', '부동산'];
      const amounts = types.map(t => appData.assets.filter(a => a.type === t).reduce((sum, a) => sum + a.amount, 0));
      return {
        labels: types,
        datasets: [{
          data: amounts,
          backgroundColor: ['#2DD4BF', '#38BDF8', '#F59E0B', '#F43F5E'],
          borderWidth: 0
        }]
      };
    }

    function getExpenseChartData() {
      const cats = appData.config.categories.slice(0, 6);
      const amounts = cats.map(c => appData.transactions.filter(t => t.type === '지출' && t.category === c).reduce((sum, t) => sum + t.amount, 0));
      return {
        labels: cats,
        datasets: [{
          label: '지출액',
          data: amounts,
          backgroundColor: '#F59E0B',
          borderRadius: 6
        }]
      };
    }

    function renderAssetList() {
      document.getElementById('asset-list').innerHTML = appData.assets.map((a, idx) => `
        <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
          <div>
            <span class="text-xs bg-slate-800 px-2 py-0.5 rounded text-teal-300">${a.type}</span>
            <span class="font-bold ml-1.5 text-slate-200">${a.name}</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="font-bold text-amber-400">${a.amount.toLocaleString()}원</span>
            <button onclick="removeAsset(${idx})" class="text-xs text-rose-500 font-bold">✕</button>
          </div>
        </div>
      `).join('');
    }

    function addAsset(e) {
      e.preventDefault();
      appData.assets.push({
        type: document.getElementById('asset-type').value,
        name: document.getElementById('asset-name').value,
        amount: parseInt(document.getElementById('asset-amount').value) || 0
      });
      saveLocalStorage();
      renderAssetList();
    }

    function removeAsset(idx) {
      appData.assets.splice(idx, 1);
      saveLocalStorage();
      renderAssetList();
    }

    function renderBudgetProgress() {
      const el = document.getElementById('budget-progress-list');
      const threshold = appData.budgetWarnThreshold || 80;

      el.innerHTML = appData.config.categories.map(c => {
        const target = appData.config.budgets[c] || 300000;
        const spent = appData.transactions.filter(t => t.type === '지출' && t.category === c).reduce((sum, t) => sum + t.amount, 0);
        const rawPct = Math.round((spent / target) * 100);
        const barPct = Math.min(rawPct, 100);

        const isWarning = rawPct >= threshold;
        const barColor = isWarning ? 'bg-rose-500' : 'bg-amber-500';

        return `
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 space-y-2">
            <div class="flex justify-between items-center text-xs font-semibold">
              <span class="font-bold text-sm text-slate-200">${c}</span>
              <div class="flex items-center space-x-2">
                <span class="${isWarning ? 'text-rose-400 font-extrabold' : 'text-amber-400'}">${spent.toLocaleString()} / ${target.toLocaleString()}원 (${rawPct}%)</span>
                <button onclick="updateBudgetTarget('${c}')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700">예산 변경</button>
              </div>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
              <div class="${barColor} h-full transition-all" style="width: ${barPct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateBudgetTarget(category) {
      const current = appData.config.budgets[category] || 300000;
      const newBudget = prompt(`[${category}] 카테고리의 월 목표 예산 금액을 입력하세요:`, current);
      if (newBudget !== null && !isNaN(newBudget) && newBudget.trim() !== '') {
        appData.config.budgets[category] = parseInt(newBudget);
        saveLocalStorage();
        renderBudgetProgress();
      }
    }

    function renderSettings() {
      document.getElementById('setting-cat-tags').innerHTML = appData.config.categories.map((c, i) => `
        <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700 flex items-center gap-1">
          ${c} <button onclick="removeConfigItem('categories', ${i})" class="text-rose-400 font-bold">×</button>
        </span>
      `).join('');
    }

    function addConfigItem(type, inputId) {
      const val = document.getElementById(inputId).value.trim();
      if (val && !appData.config[type].includes(val)) {
        appData.config[type].push(val);
        saveLocalStorage();
        renderDropdowns();
        renderSettings();
        document.getElementById(inputId).value = '';
      }
    }

    function removeConfigItem(type, idx) {
      appData.config[type].splice(idx, 1);
      saveLocalStorage();
      renderDropdowns();
      renderSettings();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `isagaja_budget_backup.json`;
      a.click();
    }

    function resetData() {
      if (confirm("정말로 모든 데이터를 초기화하시겠습니까?")) {
        localStorage.removeItem('isagaja_budget_data');
        location.reload();
      }
    }
  </script>
</body>
</html>
